<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🃏 ดัมมี่ 7 ใบ</title>
<style>
:root {
  --bg: #1a1a2e;
  --card-bg: #16213e;
  --accent: #e94560;
  --gold: #ffd700;
  --text: #e0e0e0;
  --green: #4caf50;
  --card-red: #c62828;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px;
}

/* Screens */
.screen { display: none; width: 100%; max-width: 900px; }
.screen.active { display: flex; flex-direction: column; }

/* ===== HOME ===== */
.home-hero {
  text-align: center;
  padding: 40px 20px;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  border-radius: 20px;
  margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,0.1);
}
.home-hero h1 { font-size: 2.5rem; color: var(--gold); margin-bottom: 8px; }
.home-hero p { color: #aaa; font-size: 1rem; margin-bottom: 20px; }
.form-card {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 16px;
  border: 1px solid rgba(255,255,255,0.08);
}
.form-card h3 { color: var(--gold); margin-bottom: 16px; font-size: 1.1rem; }
.form-row { margin-bottom: 12px; }
.form-row label { display: block; margin-bottom: 4px; color: #aaa; font-size: 0.85rem; }
.form-row input, .form-row select {
  width: 100%;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #0f3460;
  color: #fff;
  font-size: 1rem;
}
.btn {
  padding: 12px 28px;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary { background: linear-gradient(135deg, #e94560, #c62828); color: #fff; }
.btn-secondary { background: #0f3460; color: #fff; border: 1px solid #333; }
.btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.divider { text-align: center; color: #555; margin: 16px 0; font-size: 0.85rem; }

/* ===== LOBBY ===== */
.lobby-code {
  text-align: center;
  padding: 20px;
  background: var(--card-bg);
  border-radius: 16px;
  margin-bottom: 16px;
}
.lobby-code .label { color: #aaa; font-size: 0.9rem; margin-bottom: 8px; }
.lobby-code .code { font-size: 2.5rem; font-weight: 700; color: var(--gold); letter-spacing: 6px; }
.player-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.player-slot {
  background: var(--card-bg);
  border-radius: 14px;
  padding: 16px;
  text-align: center;
  border: 2px solid #0f3460;
}
.player-slot.filled { border-color: var(--accent); }
.player-slot.you { border-color: var(--gold); background: rgba(255,215,0,0.05); }
.player-slot .pemoji { font-size: 2rem; margin-bottom: 6px; }
.player-slot .pname { font-weight: 600; color: #fff; font-size: 0.95rem; }
.player-slot .ptype { color: #888; font-size: 0.8rem; margin-top: 4px; }

/* ===== GAME SCREEN - 4-ROW GRID LAYOUT ===== */
#game-screen {
  gap: 10px;
  max-width: 960px;
  margin: 0 auto;
}

/* Row 1: Top opponents (position 1 & 2) */
.game-row1 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* Row 2: Center - Draw + Discard */
.game-row2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: center;
  background: #16213e;
  border-radius: 16px;
  padding: 16px 24px;
  border: 1px solid rgba(255,255,255,0.08);
}

/* Row 3: Bottom opponents (position 3) */
.game-row3 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* Row 4: Player's hand */
.game-row4 {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 14px;
  border: 1px solid rgba(255,255,255,0.08);
}

/* Game header */
.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 4px;
  background: var(--card-bg);
  border-radius: 12px;
  margin-bottom: 4px;
}
.turn-indicator { font-weight: 700; color: var(--gold); font-size: 1rem; }
.round-info { color: #aaa; font-size: 0.85rem; }

/* Opponent card */
.opponent-card {
  background: var(--card-bg);
  border-radius: 14px;
  padding: 12px;
  border: 2px solid #0f3460;
  transition: border-color 0.3s;
}
.opponent-card.active-turn { border-color: var(--gold); box-shadow: 0 0 12px rgba(255,215,0,0.3); }
.opponent-card .oheader { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.opponent-card .oemoji { font-size: 1.2rem; }
.opponent-card .oname { font-weight: 600; font-size: 0.9rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opponent-card .oactive { color: var(--gold); font-size: 0.7rem; }
.opponent-card .ocard-mini {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  min-height: 36px;
}
.mini-card {
  width: 28px;
  height: 36px;
  border-radius: 4px;
  background: #fff;
  border: 1px solid #ccc;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.6rem;
  font-weight: 700;
  color: #333;
  overflow: hidden;
}
.mini-card.red { background: #fff5f5; color: #c62828; border-color: #ef9a9a; }
.mini-card.black { background: #f5f5ff; color: #1a237e; border-color: #9fa8da; }
.mini-card.joker { background: linear-gradient(135deg,#ffd700,#ff8f00); color: #fff; border-color: #ffd700; }
.mini-card.speto { background: #1a1a2e; color: #ffd700; border-color: #ffd700; }
.opponent-card .omeld-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.meld-chip {
  background: #0f3460;
  border: 1px solid var(--gold);
  border-radius: 6px;
  padding: 2px 6px;
  font-size: 0.65rem;
  color: var(--gold);
}

/* Center area */
.center-deck {
  text-align: center;
}
.deck-label { color: #aaa; font-size: 0.8rem; margin-bottom: 6px; }
.deck-stack {
  display: inline-flex;
  flex-direction: column-reverse;
  align-items: center;
  cursor: pointer;
  position: relative;
  width: 64px;
  margin: 0 auto;
}
.deck-stack .card {
  width: 56px;
  height: 76px;
  background: var(--accent);
  border-radius: 8px;
  border: 2px solid #fff3;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}
.deck-stack .card:nth-child(1) { top: 8px; opacity: 0.3; }
.deck-stack .card:nth-child(2) { top: 4px; opacity: 0.6; }
.deck-stack .card:nth-child(3) { top: 0; }
.deck-count { color: #888; font-size: 0.8rem; margin-top: 6px; }

.discard-area {
  text-align: center;
}
.discard-pile-cards {
  display: flex;
  justify-content: center;
  gap: 6px;
  min-height: 80px;
  align-items: center;
  flex-wrap: wrap;
}
.discard-pile-cards .dp-card {
  width: 56px;
  height: 76px;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 2px solid;
  font-size: 0.8rem;
  font-weight: 700;
  gap: 2px;
}
.discard-pile-cards .dp-card.red { background: #fff5f5; border-color: #ef9a9a; color: #c62828; }
.discard-pile-cards .dp-card.black { background: #f5f5ff; border-color: #9fa8da; color: #1a237e; }
.discard-pile-cards .dp-card.joker { background: linear-gradient(135deg,#ffd700,#ff8f00); border-color: #ffd700; color: #fff; }
.discard-pile-cards .dp-card.speto { background: #1a1a2e; border-color: #ffd700; color: #ffd700; }

/* Player hand */
.your-hand-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.your-hand-header .yname { font-weight: 700; color: var(--gold); font-size: 1rem; }
.hand-status { color: #aaa; font-size: 0.8rem; }
.hand-cards {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  min-height: 90px;
  align-items: center;
}
.hand-card {
  width: 56px;
  height: 76px;
  border-radius: 8px;
  border: 2px solid;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-weight: 700;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}
.hand-card.red { background: #fff5f5; border-color: #ef9a9a; color: #c62828; }
.hand-card.black { background: #f5f5ff; border-color: #9fa8da; color: #1a237e; }
.hand-card.joker { background: linear-gradient(135deg,#ffd700,#ff8f00); border-color: #ffd700; color: #fff; }
.hand-card.speto { background: #1a1a2e; border-color: #ffd700; color: #ffd700; }
.hand-card.selected { transform: translateY(-12px); box-shadow: 0 8px 20px rgba(255,215,0,0.5); border-color: var(--gold); }
.hand-card.disabled { cursor: default; }
.hand-card .cr { font-size: 1rem; }
.hand-card .cs { font-size: 1.3rem; }
.hand-card .ctag {
  position: absolute;
  bottom: 2px;
  right: 3px;
  font-size: 0.5rem;
  color: #888;
}

/* Meld row in player area */
.meld-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid #333;
}
.meld-set-display {
  display: flex;
  gap: 3px;
  align-items: center;
}
.meld-set-display .ms-card {
  width: 32px;
  height: 44px;
  border-radius: 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 0.55rem;
  font-weight: 700;
  border: 1px solid;
}
.meld-set-display .ms-card.red { background: #fff5f5; border-color: #ef9a9a; color: #c62828; }
.meld-set-display .ms-card.black { background: #f5f5ff; border-color: #9fa8da; color: #1a237e; }
.meld-set-display .ms-card.joker { background: linear-gradient(135deg,#ffd700,#ff8f00); border-color: #ffd700; color: #fff; }
.meld-set-display .ms-card.speto { background: #1a1a2e; border-color: #ffd700; color: #ffd700; }

/* Action bar */
.action-bar {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  padding: 10px 4px;
}
.action-bar .btn {
  padding: 10px 20px;
  font-size: 0.95rem;
  border-radius: 10px;
}

/* Scoreboard */
.scoreboard {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 10px;
  margin-top: 4px;
}
.score-row {
  display: flex;
  justify-content: space-around;
  gap: 8px;
}
.score-item {
  text-align: center;
  padding: 6px 12px;
  border-radius: 8px;
  min-width: 60px;
}
.score-item.highlight { background: rgba(255,215,0,0.08); }
.score-item .sname { font-size: 0.75rem; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70px; }
.score-item .spoint { font-size: 1.1rem; font-weight: 700; }

/* Notification */
.notification {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.9);
  color: #fff;
  padding: 12px 24px;
  border-radius: 12px;
  font-weight: 600;
  z-index: 1000;
  display: none;
  border: 1px solid var(--gold);
  text-align: center;
  max-width: 90%;
}
.notification.show { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 500;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 24px;
  width: 90%;
  max-width: 700px;
  max-height: 80vh;
  overflow-y: auto;
  border: 1px solid rgba(255,255,255,0.1);
}
.modal h3 { color: var(--gold); margin-bottom: 16px; text-align: center; }
.modal-close {
  float: right;
  background: none;
  border: none;
  color: #888;
  font-size: 1.2rem;
  cursor: pointer;
}
.meld-sets {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}
.meld-set {
  background: #0f3460;
  border: 2px solid #0f3460;
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: all 0.2s;
}
.meld-set:hover { border-color: var(--gold); }
.endgame-modal {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 30px;
  width: 90%;
  max-width: 500px;
  text-align: center;
  border: 1px solid var(--gold);
}
.endgame-modal h2 { color: var(--gold); margin-bottom: 16px; }
.winner-name { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 16px; }
.endgame-table { width: 100%; border-collapse: collapse; margin: 16px 0; }
.endgame-table th, .endgame-table td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #333; }
.endgame-table .winner-row { background: rgba(255,215,0,0.1); color: var(--gold); font-weight: 700; }
.endgame-modal .btn { margin: 6px; }

/* Confetti */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
.confetti-piece {
  position: absolute;
  width: 10px;
  height: 10px;
  top: -20px;
  animation: confettiFall 3s ease-in forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* Responsive */
@media (max-width: 600px) {
  .home-hero h1 { font-size: 1.8rem; }
  .hand-card { width: 44px; height: 62px; }
  .mini-card { width: 22px; height: 30px; font-size: 0.5rem; }
  .game-row1, .game-row2, .game-row3 { gap: 6px; }
  .opponent-card { padding: 8px; }
  .score-row { flex-wrap: wrap; }
}
</style>
</head>
<body>

<!-- ===== HOME ===== -->
<div id="home-screen" class="screen active">
  <div class="home-hero">
    <h1>🃏 ดัมมี่ 7 ใบ</h1>
    <p>เล่นออนไลน์ real-time กับเพื่อนและ AI</p>
  </div>

  <div class="form-card">
    <h3>➕ สร้างห้องใหม่</h3>
    <div class="form-row">
      <label>ชื่อของคุณ</label>
      <input type="text" id="create-name" placeholder="ใส่ชื่อของคุณ" maxlength="20">
    </div>
    <div class="form-row">
      <label>จำนวนผู้เล่น</label>
      <select id="bot-count">
        <option value="3">🤖🤖🤖 มีคน 1 คน → เติม AI 3 คน</option>
        <option value="2" selected>🤖🤖 มีคน 2 คน → เติม AI 2 คน</option>
        <option value="1">🤖 มีคน 3 คน → เติม AI 1 คน</option>
      </select>
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="createRoom()">🎮 สร้างห้อง</button>
  </div>

  <div class="divider">— หรือ —</div>

  <div class="form-card">
    <h3>🔗 เข้าห้องที่มีอยู่แล้ว</h3>
    <div class="form-row">
      <label>รหัสห้อง (6 ตัว)</label>
      <input type="text" id="join-code" placeholder="ABC123" maxlength="6" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:1.3rem">
    </div>
    <div class="form-row">
      <label>ชื่อของคุณ</label>
      <input type="text" id="join-name" placeholder="ใส่ชื่อของคุณ" maxlength="20">
    </div>
    <button class="btn btn-secondary" style="width:100%" onclick="joinRoom()">🚪 เข้าห้อง</button>
  </div>
</div>

<!-- ===== LOBBY ===== -->
<div id="lobby-screen" class="screen">
  <div class="game-header" style="margin-bottom:12px">
    <span style="color:var(--gold);font-weight:700">🏠 ห้องรอ...</span>
    <button class="btn btn-secondary" onclick="leaveRoom()" style="padding:6px 14px;font-size:0.85rem">← ออก</button>
  </div>

  <div class="lobby-code">
    <div class="label">รหัสห้อง</div>
    <div class="code" id="display-room-code">------</div>
    <div style="color:#888;font-size:0.85rem;margin-top:8px">ส่งรหัสนี้ให้เพื่อนเข้ามาร่วมได้เลย!</div>
  </div>

  <div class="player-grid" id="player-list"></div>

  <button class="btn btn-primary" id="btn-start" onclick="startGame()" style="width:100%;font-size:1.1rem;padding:14px">
    🎮 เริ่มเกม!
  </button>
</div>

<!-- ===== GAME ===== -->
<div id="game-screen" class="screen">
  <!-- Header -->
  <div class="game-header">
    <span class="turn-indicator" id="turn-indicator">รอเกมเริ่ม...</span>
    <span class="round-info" id="round-info">รอบ: -</span>
    <button class="btn btn-secondary" onclick="leaveRoom()" style="padding:6px 14px;font-size:0.85rem">← ออก</button>
  </div>

  <!-- ROW 1: Top opponents (position 1 & 2) -->
  <div class="game-row1" id="row-opponents-top"></div>

  <!-- ROW 2: Center (Draw + Discard) -->
  <div class="game-row2">
    <div class="center-deck">
      <div class="deck-label">📦 กองจั่ว</div>
      <div class="deck-stack" id="draw-deck" onclick="drawCard()">
        <div class="card"></div>
        <div class="card"></div>
        <div class="card">
          <span style="color:#ffd700;font-size:2rem">🂠</span>
        </div>
      </div>
      <div class="deck-count" id="deck-count">0 ใบ</div>
    </div>

    <div class="discard-area">
      <div class="deck-label">🗑️ กองทิ้ง</div>
      <div class="discard-pile-cards" id="discard-pile"></div>
      <div class="deck-label" style="margin-top:4px">คลิกที่ไพ่เพื่อหยิบ</div>
    </div>
  </div>

  <!-- ROW 3: Bottom opponents (position 3 & filler) -->
  <div class="game-row3" id="row-opponents-bottom"></div>

  <!-- ROW 4: Player's hand -->
  <div class="game-row4">
    <div class="your-hand-header">
      <span class="yname" id="your-name">คุณ</span>
      <span class="hand-status" id="hand-status">⏳ รอตาคนอื่น...</span>
    </div>
    <div class="hand-cards" id="your-hand"></div>
    <div class="meld-row" id="player-meld-row"></div>

    <!-- Actions -->
    <div class="action-bar" id="action-bar">
      <button class="btn btn-primary" onclick="drawCard()" id="btn-draw" disabled>📦 จั่ว</button>
      <button class="btn btn-secondary" onclick="openMeldModal()" id="btn-meld" disabled>🃏 เกิด</button>
      <button class="btn btn-secondary" onclick="discardSelected()" id="btn-discard" disabled>🗑️ ทิ้ง (เลือก 1 ใบ)</button>
      <button class="btn btn-primary" onclick="endTurn()" id="btn-end" disabled>✓ จบตา</button>
    </div>
  </div>

  <!-- Scoreboard -->
  <div class="scoreboard">
    <div class="score-row" id="score-row"></div>
  </div>
</div>

<!-- ===== MELD MODAL ===== -->
<div class="modal-overlay" id="meld-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeMeldModal()">✕</button>
    <h3>🃏 ชุดไพ่ที่เกิดได้</h3>
    <div id="meld-section"></div>
    <div style="margin-top:16px; display:flex; gap:10px; justify-content:center">
      <button class="btn btn-secondary" onclick="closeMeldModal()">ยกเลิก</button>
      <button class="btn btn-primary" onclick="confirmMeld()" id="btn-confirm-meld" disabled>✅ ยืนยันการเกิด</button>
    </div>
  </div>
</div>

<!-- ===== END GAME MODAL ===== -->
<div class="modal-overlay" id="endgame-modal">
  <div class="endgame-modal">
    <h2>🏆 จบเกม!</h2>
    <div class="winner-name" id="winner-name">---</div>
    <table class="endgame-table" id="endgame-table"></table>
